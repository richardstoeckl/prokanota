name: release

on:
  release:
    types: [released]

permissions: {}

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    env:
      UV_PYTHON: "3.14"
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(tr -d '\r\n' < prokanota/prokanota.VERSION)"
          if [ "$RELEASE_TAG" != "$package_version" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package version '$package_version'"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.11.32"

      - name: Install Python
        run: uv python install 3.14

      - name: Build distributions
        run: uv build --no-sources

      - name: CLI from wheel
        run: uv run --isolated --no-project --with dist/*.whl prokanota run --help

      - name: CLI from source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz prokanota run --help

      - name: Store distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/prokanota/
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

  attach-to-release:
    needs: publish-pypi
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/

      - name: Attach distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*
